<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Info Aset Lab TKJ</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    #loading {
      position: fixed; inset: 0; background: #0f172a;
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 16px; z-index: 10; transition: opacity 0.4s;
    }
    #loading.hide { opacity: 0; pointer-events: none; }
    .spinner {
      width: 44px; height: 44px;
      border: 4px solid rgba(14,165,233,0.2); border-top-color: #0ea5e9;
      border-radius: 50%; animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loading p { font-family: system-ui, sans-serif; font-size: 14px; color: #64748b; }
    #loading b { color: #38bdf8; display: block; font-size: 13px; margin-top: 4px; text-align: center; }
    #error-box {
      display: none; position: fixed; inset: 0; background: #0f172a;
      align-items: center; justify-content: center; flex-direction: column;
      gap: 12px; padding: 32px; text-align: center; font-family: system-ui, sans-serif;
    }
    #error-box.show { display: flex; }
    #error-box p { font-size: 14px; color: #94a3b8; }
    #error-box a { color: #38bdf8; font-size: 13px; }
    iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: none; background: #0f172a; }
  </style>
</head>
<body>

  <div id="loading">
    <div class="spinner"></div>
    <div><p>Memuat informasi aset...</p><b id="id-label"></b></div>
  </div>

  <div id="error-box">
    <p>ID aset tidak ditemukan.<br>Pastikan QR code dicetak dengan benar.</p>
    <a href="https://stkjn.github.io/r/">Kembali</a>
  </div>

  <iframe id="frame" title="Info Aset" sandbox="allow-scripts allow-same-origin allow-forms allow-popups"></iframe>

  <script>
    var GAS_URL = 'https://script.google.com/macros/s/AKfycbwRcAtSONsbnvUb-RKYckW_XzJXEnFMQdRBzDmJL9POcmGFSWLvc2LLtWuzV6NrmGVitA/exec';
    var params  = new URLSearchParams(window.location.search);
    var assetId = params.get('id') || '';
    var loading = document.getElementById('loading');
    var frame   = document.getElementById('frame');
    var errBox  = document.getElementById('error-box');

    if (!assetId) {
      loading.style.display = 'none';
      errBox.classList.add('show');
    } else {
      document.getElementById('id-label').textContent = 'ID: ' + assetId;
      frame.src = GAS_URL + '?page=detail&id=' + encodeURIComponent(assetId);
      frame.addEventListener('load', function () {
        loading.classList.add('hide');
        setTimeout(function () { loading.style.display = 'none'; }, 450);
      });
      setTimeout(function () {
        loading.classList.add('hide');
        setTimeout(function () { loading.style.display = 'none'; }, 450);
      }, 20000);
    }
  </script>

</body>
</html>
