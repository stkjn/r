<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Membuka Informasi Aset...</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      text-align: center;
      max-width: 320px;
      width: 100%;
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(14,165,233,0.2);
      border-top-color: #0ea5e9;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 20px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    h1 { font-size: 18px; font-weight: 700; color: #f1f5f9; margin-bottom: 8px; }
    p  { font-size: 13px; color: #64748b; }
    .badge {
      display: inline-block;
      margin-top: 16px;
      background: rgba(14,165,233,0.1);
      border: 1px solid rgba(14,165,233,0.3);
      color: #38bdf8;
      font-size: 11px;
      font-weight: 700;
      padding: 4px 12px;
      border-radius: 999px;
      letter-spacing: 0.05em;
    }
    .fallback {
      margin-top: 24px;
      font-size: 12px;
      color: #475569;
    }
    .fallback a {
      color: #38bdf8;
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="spinner"></div>
    <h1>Membuka Informasi Aset</h1>
    <p>Anda akan diarahkan ke halaman detail aset secara otomatis...</p>
    <div class="badge" id="asset-id">Memuat ID...</div>
    <p class="fallback">Jika tidak otomatis terbuka, <a id="manual-link" href="#">klik di sini</a>.</p>
  </div>

  <script>
    // ================================================================
    // KONFIGURASI — ganti nilai GAS_URL jika Web App di-redeploy
    // ================================================================
    const GAS_URL = "https://script.google.com/macros/s/AKfycbwRcAtSONsbnvUb-RKYckW_XzJXEnFMQdRBzDmJL9POcmGFSWLvc2LLtWuzV6NrmGVitA/exec";
    // ================================================================

    // Baca parameter ?id= dari URL halaman ini
    const params  = new URLSearchParams(window.location.search);
    const assetId = params.get('id') || '';

    // Tampilkan ID di badge
    document.getElementById('asset-id').textContent = assetId ? '🔍 ID: ' + assetId : '⚠️ ID tidak ditemukan';

    // Bangun URL tujuan
    const targetUrl = GAS_URL + "?page=detail&id=" + encodeURIComponent(assetId);

    // Pasang link fallback manual
    document.getElementById('manual-link').href = targetUrl;

    // Redirect via JavaScript setelah 800ms
    // (JavaScript redirect menghindari Android Drive interception)
    if (assetId) {
      setTimeout(function() {
        window.location.href = targetUrl;
      }, 800);
    } else {
      document.querySelector('h1').textContent = 'ID Aset Tidak Ditemukan';
      document.querySelector('p').textContent  = 'QR Code ini tidak menyertakan ID aset yang valid.';
      document.querySelector('.spinner').style.display = 'none';
    }
  </script>
</body>
</html>
